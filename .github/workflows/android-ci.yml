name: Android CI

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build type (debug/release)'
        required: true
        default: 'debug'
        type: choice
        options:
          - debug
          - release
      run_tests:
        description: 'Run tests'
        required: false
        default: true
        type: boolean
      run_lint:
        description: 'Run lint'
        required: false
        default: true
        type: boolean

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: P2PChat

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Verify gradlew exists
        run: ls -la ./gradlew

      - name: Build with Gradle
        run: ./gradlew build

      - name: Run tests
        if: github.event_name == 'workflow_dispatch' && inputs.run_tests == true || github.event_name != 'workflow_dispatch'
        run: ./gradlew test

      - name: Build debug APK
        if: github.event_name != 'workflow_dispatch' || inputs.build_type == 'debug'
        run: ./gradlew assembleDebug

      - name: Build release APK
        if: github.event_name == 'workflow_dispatch' && inputs.build_type == 'release'
        run: ./gradlew assembleRelease

      - name: Sign Release APK
        if: github.event_name == 'workflow_dispatch' && inputs.build_type == 'release'
        uses: rstudio/android-sign-action@v1.3.1
        with:
          releaseDirectory: P2PChat/app/build/outputs/apk/release
          signingKeyBase64: ${{ secrets.SIGNING_KEY }}
          alias: ${{ secrets.ALIAS }}
          keyStorePassword: ${{ secrets.KEY_STORE_PASSWORD }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}

      - name: Create GitHub Release
        if: github.event_name == 'workflow_dispatch' && inputs.build_type == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: P2PChat/app/build/outputs/apk/release/*-signed.apk
          tag_name: v1.0.${{ github.run_number }}
          name: Release v1.0.${{ github.run_number }}
          body: "Automated Release build generated by GitHub Actions."
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  lint:
    runs-on: ubuntu-latest
    if: github.event_name != 'workflow_dispatch' || inputs.run_lint == true
    defaults:
      run:
        working-directory: P2PChat

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Verify gradlew exists
        run: ls -la ./gradlew

      - name: Run lint
        run: ./gradlew lint
