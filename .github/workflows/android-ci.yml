name: Android CI

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build type (debug/release)'
        required: true
        default: 'debug'
        type: choice
        options:
          - debug
          - release
      run_tests:
        description: 'Run tests'
        required: false
        default: true
        type: boolean
      run_lint:
        description: 'Run lint'
        required: false
        default: true
        type: boolean

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: P2PChat

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Verify gradlew exists
        run: ls -la ./gradlew

      - name: Build with Gradle
        run: ./gradlew build

      - name: Run tests
        if: github.event_name == 'workflow_dispatch' && inputs.run_tests == true || github.event_name != 'workflow_dispatch'
        run: ./gradlew test

      - name: Build debug APK
        if: github.event_name != 'workflow_dispatch' || inputs.build_type == 'debug'
        run: ./gradlew assembleDebug

      - name: Build release APK
        if: github.event_name == 'workflow_dispatch' && inputs.build_type == 'release'
        run: ./gradlew assembleRelease

      - name: Upload debug APK artifact
        if: github.event_name != 'workflow_dispatch' || inputs.build_type == 'debug'
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: P2PChat/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload release APK artifact
        if: github.event_name == 'workflow_dispatch' && inputs.build_type == 'release'
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: P2PChat/app/build/outputs/apk/release/app-release.apk

  lint:
    runs-on: ubuntu-latest
    if: github.event_name != 'workflow_dispatch' || inputs.run_lint == true
    defaults:
      run:
        working-directory: P2PChat

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Verify gradlew exists
        run: ls -la ./gradlew

      - name: Run lint
        run: ./gradlew lint
